server {
    listen 80;
    root /var/www/html;
    index index.php index.html;

    # Never expose configuration, database files, tools or dependency sources.
    location ~ /\. { return 404; }
    location ~* ^/(data|nginx|var|install|tools|tests)(/|$) { return 404; }
    location ~* ^/(docker-compose\.ya?ml|Dockerfile[^/]*|AGENTS\.md|package[^/]*\.json)$ { return 404; }
    location ~* /(node_modules|tools|tests)(/|$) { return 404; }
    location ~* \.(sql|bak|log|ini|env|zip|frm|ibd|MAI|MAD)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Static assets: cache for 30 days
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
